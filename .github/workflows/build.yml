name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pytest

      # Plain docker commands: this repository only allows GitHub-owned actions.
      - name: Build and push
        env:
          IMAGE: ghcr.io/eua-angkoon-n/telegram-restricted-content-forwarder:sha-${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE" --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" .
          docker push "$IMAGE"
