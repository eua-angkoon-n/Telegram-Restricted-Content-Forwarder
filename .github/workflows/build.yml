name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pytest

      # The image travels as a workflow artifact and is loaded on the server
      # with `docker load`: the registry refuses pushes from this repository.
      - name: Build image
        env:
          IMAGE: telegram-forwarder:sha-${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker save "$IMAGE" | gzip > telegram-forwarder.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-forwarder-image
          path: telegram-forwarder.tar.gz
          compression-level: 0
          retention-days: 30
