# Production stack for the shared VPS. The image is built by GitHub Actions and
# loaded here with `docker load`; `compose.yaml` in the repository root is for
# local use.
name: tg-forwarder

services:
  app:
    image: "telegram-forwarder:${IMAGE_TAG:?Set IMAGE_TAG in .env}"
    pull_policy: never
    container_name: tg-forwarder
    env_file: .env
    environment:
      APP_DATA_DIR: /data
    ports:
      - "127.0.0.1:3004:8080"
    volumes:
      # Telegram sessions live here; losing this directory means signing in again.
      - /srv/tg-forwarder/data:/data
    mem_limit: 256m
    restart: unless-stopped
