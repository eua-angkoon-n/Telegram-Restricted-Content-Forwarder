# Production stack for the shared VPS. The image is built by GitHub Actions and
# only pulled here; `compose.yaml` in the repository root is for local use.
name: tg-forwarder

services:
  app:
    image: "ghcr.io/eua-angkoon-n/telegram-restricted-content-forwarder:${IMAGE_TAG:?Set IMAGE_TAG in .env}"
    container_name: tg-forwarder
    env_file: .env
    environment:
      APP_DATA_DIR: /data
    ports:
      - "127.0.0.1:3004:8080"
    volumes:
      # Telegram sessions live here; losing this directory means signing in again.
      - /srv/tg-forwarder/data:/data
    mem_limit: 256m
    restart: unless-stopped
